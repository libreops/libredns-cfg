---
- name: Install Packages
  apt:
    pkg:
      - git
    state: present

- name: Check if website is already cloned
  stat:
    path: /var/www/html/.git
  register: website_git

- name: Remove default web folder
  file:
    path: /var/www/html/
    state: absent
  when: not website_git.stat.exists

- name: Fetch website
  git:
    repo: "{{ website_repo }}"
    dest: /var/www/html/
    version: master
