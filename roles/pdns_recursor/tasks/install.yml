---
- name: Make sure apt keyrings directory exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: 0755

- name: Check if PowerDNS Recursor apt signing key exists
  stat:
    path: "/etc/apt/keyrings/{{ pdns_rec_key }}"
  register: pdns_rec_key_file

- name: Add PowerDNS Recursor apt signing key
  get_url:
    url: https://repo.powerdns.com/FD380FBB-pub.asc
    dest: "/etc/apt/keyrings/{{ pdns_rec_key }}"
    mode: 0644
  when: not pdns_rec_key_file.stat.exists

- name: Add PowerDNS Recursor repo
  copy:
    dest: /etc/apt/sources.list.d/powerdns-rec.sources
    mode: 0644
    content: |
      Types: deb
      URIs: http://repo.powerdns.com/ubuntu
      Suites: {{ pdns_rec_ver }}
      Components: main
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/{{ pdns_rec_key }}

- name: Remove legacy one-line PowerDNS repo file
  file:
    path: /etc/apt/sources.list.d/repo_powerdns_com_ubuntu.list
    state: absent

- name: Ansible copy file to remote server
  copy:
    src: apt.pdns
    dest: /etc/apt/preferences.d/pdns
    mode: 0644

- name: Install PowerDNS packages
  apt:
    pkg: pdns-recursor
    state: present
    update_cache: yes
    policy_rc_d: 101
