---
- name: Make sure apt keyrings directory exists
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: 0755

- name: Check if PowerDNS Recursor apt signing key exists
  stat:
    path: "/etc/apt/keyrings/{{ pdns_rec_key }}"
  register: pdns_rec_key_file

- name: Add PowerDNS Recursor apt signing key
  get_url:
    url: https://repo.powerdns.com/FD380FBB-pub.asc
    dest: "/etc/apt/keyrings/{{ pdns_rec_key }}"
    mode: 0644
  when: not pdns_rec_key_file.stat.exists

- name: Add PowerDNS Recursor repo
  copy:
    dest: /etc/apt/sources.list.d/powerdns-rec.sources
    mode: 0644
    content: |
      Types: deb
      URIs: http://repo.powerdns.com/ubuntu
      Suites: {{ pdns_rec_ver }}
      Components: main
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/{{ pdns_rec_key }}
  register: pdns_rec_repo

- name: Remove legacy one-line PowerDNS repo file
  file:
    path: /etc/apt/sources.list.d/repo_powerdns_com_ubuntu.list
    state: absent

- name: Ansible copy file to remote server
  copy:
    src: apt.pdns
    dest: /etc/apt/preferences.d/pdns
    mode: 0644

# Install the pdns_rec_ver release series, eg. pdns-recursor=5.4*, which also
# moves an older series to it. Patch releases come with playbooks/update_os.yml.
# policy_rc_d stops the package from restarting the recursors, the handler and
# pdns-ads.yml restart them after their YAML configuration is in place.
# A dry run cannot see the new series before the repo file is written, skip it
- name: Install PowerDNS packages
  apt:
    pkg: "pdns-recursor={{ pdns_rec_pkg_ver }}"
    state: present
    update_cache: yes
    policy_rc_d: 101
  register: pdns_rec_install
  notify: restart pdns-recursor
  when: not (ansible_check_mode and pdns_rec_repo is changed)
