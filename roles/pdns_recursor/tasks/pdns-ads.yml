---
- name: Powerdns Recursor ads Configuration
  template:
    src: recursor-ads.yml.j2
    dest: /etc/powerdns/recursor-ads.yml
    mode: 0640
    group: pdns
  notify: restart pdns-recursor-ads

# recursor-ads.yml replaces the old-style recursor-ads.conf
- name: Remove old-style Powerdns Recursor ads configuration
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/powerdns/recursor-ads.conf
    - /etc/powerdns/recursor-ads.yml.new
  notify: restart pdns-recursor-ads

- name: Copy recursor ads systemd service file
  copy:
    src: pdns-recursor-ads.service
    dest: /lib/systemd/system/pdns-recursor-ads.service
    mode: 0644
  notify: restart pdns-recursor-ads

- name: Enable service pdns-recursor-ads, also issue daemon-reload
  systemd:
    state: started
    enabled: yes
    daemon_reload: yes
    name: pdns-recursor-ads
