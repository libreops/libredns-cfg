# config file for ansible -- http://ansible.com/
# ==============================================

# nearly all parameters can be overridden in ansible-playbook
# or with command line flags. ansible will read ANSIBLE_CONFIG,
# ansible.cfg in the current working directory, .ansible.cfg in
# the home directory or /etc/ansible/ansible.cfg, whichever it
# finds first

[defaults]

# some basic default values...

inventory=hosts

# pin the remote Python instead of relying on interpreter discovery
interpreter_python=/usr/bin/python3

# ansible_managed is set as a play variable in main.yml, so templates
# render the same header on every run.

# don't like cows?  that's unfortunate.
# set to 1 if you don't want cowsay support or export ANSIBLE_NOCOWS=1
nocows=1

# Use open_the_vault.sh to decrypt the vault file
# the script needs to be executable
vault_password_file=./bin/open_the_vault.sh

retry_files_save_path=/tmp

roles_path=roles
