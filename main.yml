- hosts: libredns
  become: yes
  gather_facts: yes

  vars:
    ansible_managed: "Ansible managed: do not edit by hand, changes will be overwritten"
    DOMAIN: "libredns.gr"
    IPv4: "116.202.176.26"
    IPv6: "2a01:4f8:1c0c:8274::1"
    STAGING: "--staging"
    GANDI_LIVEDNS_KEY: ""
    website_repo: "https://gitlab.com/libreops/libredns/libredns.gr.git"

  vars_files:
    - private.yml

  roles:
    - { role: common, tags: common }
    - { role: iptables, tags: iptables }
    - { role: sshd, tags: sshd }
    - { role: pdns_recursor, tags: pdns_recursor }
    - { role: acme, tags: acme }
    - { role: dnsdist, tags: dnsdist }
    - { role: nginx, tags: nginx }
    - { role: website, tags: website }
    - { role: monitoring, tags: monitoring }
